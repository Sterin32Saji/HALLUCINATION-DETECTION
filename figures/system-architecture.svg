<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="945" viewBox="0 0 1200 945" role="img" aria-labelledby="title desc">
  <title id="title">Technical RAG hallucination detection architecture</title>
  <desc id="desc">Four stages: corpus indexing, RAG answer generation, offline evaluation, and a separate live prototype path. Offline detector decisions feed the trained hybrid; live heuristic proxy bits feed the saved hybrid model instead. Only the offline path has held-out metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#35445a"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .band { fill: #f4f7fa; stroke: #c8d3df; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #46566b; stroke-width: 1.7; }
      .data { fill: #fff8e9; stroke: #9a6b19; stroke-width: 1.7; }
      .model { fill: #f3eef9; stroke: #664385; stroke-width: 1.7; }
      .custom { fill: #eef8f1; stroke: #39764b; stroke-width: 1.7; }
      .heading { font: bold 24px Arial, sans-serif; fill: #162236; }
      .section { font: bold 16px Arial, sans-serif; fill: #27364b; }
      .label { font: bold 15px Arial, sans-serif; fill: #19273a; }
      .detail { font: 13px Arial, sans-serif; fill: #34445a; }
      .note { font: 12px Arial, sans-serif; fill: #43536a; }
      .flow { fill: none; stroke: #35445a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="background" width="1200" height="945"/>
  <text class="heading" x="48" y="42">Technical RAG Hallucination Detection System</text>

  <rect class="band" x="40" y="70" width="1120" height="160" rx="7"/>
  <text class="section" x="62" y="99">1. Corpus and index construction</text>
  <rect class="node" x="70" y="125" width="220" height="78" rx="6"/>
  <text class="label" x="88" y="150">Technical PDFs</text>
  <text class="detail" x="88" y="173">NIST, OWASP, RFC, AWS</text>
  <rect class="node" x="345" y="125" width="220" height="78" rx="6"/>
  <text class="label" x="363" y="150">Text chunking</text>
  <text class="detail" x="363" y="173">800 characters; 120 overlap</text>
  <rect class="node" x="620" y="125" width="220" height="78" rx="6"/>
  <text class="label" x="638" y="150">Sentence embeddings</text>
  <text class="detail" x="638" y="173">384 dimensions</text>
  <rect class="data" x="895" y="125" width="220" height="78" rx="6"/>
  <text class="label" x="913" y="150">FAISS index</text>
  <text class="detail" x="913" y="173">7,513 searchable chunks</text>
  <path class="flow" d="M290 164 H345"/>
  <path class="flow" d="M565 164 H620"/>
  <path class="flow" d="M840 164 H895"/>

  <rect class="band" x="40" y="255" width="1120" height="160" rx="7"/>
  <text class="section" x="62" y="284">2. RAG answer generation</text>
  <rect class="node" x="70" y="310" width="220" height="78" rx="6"/>
  <text class="label" x="88" y="335">User question</text>
  <text class="detail" x="88" y="358">Technical query</text>
  <rect class="node" x="345" y="310" width="220" height="78" rx="6"/>
  <text class="label" x="363" y="335">Retriever</text>
  <text class="detail" x="363" y="358">Top-k evidence chunks</text>
  <rect class="node" x="620" y="310" width="220" height="78" rx="6"/>
  <text class="label" x="638" y="335">Answer generator</text>
  <text class="detail" x="638" y="358">Ollama Qwen 2.5:7B</text>
  <rect class="data" x="895" y="310" width="220" height="78" rx="6"/>
  <text class="label" x="913" y="335">RAG output</text>
  <text class="detail" x="913" y="358">Answer and evidence</text>
  <path class="flow" d="M290 349 H345"/>
  <path class="flow" d="M565 349 H620"/>
  <path class="flow" d="M840 349 H895"/>
  <path class="flow" d="M1005 203 V242 H455 V310"/>

  <rect class="band" x="40" y="440" width="1120" height="315" rx="7"/>
  <text class="section" x="62" y="469">3. Offline benchmark and detector evaluation</text>
  <rect class="data" x="70" y="520" width="205" height="155" rx="6"/>
  <path class="flow" d="M1005 388 V427 H25 V597 H70"/>
  <text class="label" x="88" y="549">Labelled benchmark</text>
  <text class="detail" x="88" y="576">300 records</text>
  <text class="detail" x="88" y="598">Question, generated answer,</text>
  <text class="detail" x="88" y="617">evidence and human label</text>
  <text class="detail" x="88" y="649">Split: 210 / 45 / 45</text>

  <rect class="model" x="335" y="515" width="200" height="85" rx="6"/>
  <text class="label" x="353" y="543">Four detector tracks</text>
  <text class="note" x="353" y="564">Judge, RAGAS,</text>
  <text class="note" x="353" y="581">SelfCheck-style, similarity</text>

  <rect class="model" x="605" y="515" width="200" height="85" rx="6"/>
  <text class="label" x="623" y="543">Hybrid classifier</text>
  <text class="detail" x="623" y="568">Logistic regression</text>
  <text class="note" x="623" y="586">Four binary inputs</text>

  <rect class="custom" x="605" y="625" width="200" height="75" rx="6"/>
  <text class="label" x="623" y="653">Custom detector</text>
  <text class="detail" x="623" y="678">38 features; separate model</text>

  <rect class="data" x="875" y="545" width="240" height="125" rx="6"/>
  <text class="label" x="893" y="573">Held-out results</text>
  <text class="detail" x="893" y="598">45 test records</text>
  <text class="detail" x="893" y="620">Metrics and figures</text>
  <text class="note" x="893" y="643">Offline results only</text>

  <path class="flow" d="M275 550 H335"/>
  <path class="flow" d="M535 557 H605"/>
  <path class="flow" d="M275 655 H605"/>
  <path class="flow" d="M805 557 H845 V577 H875"/>
  <path class="flow" d="M805 662 H845 V635 H875"/>
  <text class="note" x="70" y="733">The custom detector is fitted separately from the four-decision hybrid classifier.</text>

  <rect class="band" x="40" y="770" width="1120" height="155" rx="7"/>
  <text class="section" x="62" y="799">4. Live hybrid prototype (separate, unvalidated input path)</text>
  <rect class="data" x="70" y="815" width="220" height="75" rx="6"/>
  <text class="label" x="88" y="840">Live RAG output</text>
  <text class="detail" x="88" y="865">Stage 2 answer and evidence</text>
  <rect class="model" x="345" y="815" width="220" height="75" rx="6"/>
  <text class="label" x="363" y="840">Four proxy bits</text>
  <text class="detail" x="363" y="861">Similarity and heuristic rules</text>
  <text class="note" x="363" y="879">Not live RAGAS or SelfCheck</text>
  <rect class="model" x="620" y="815" width="220" height="75" rx="6"/>
  <text class="label" x="638" y="840">Saved hybrid classifier</text>
  <text class="detail" x="638" y="865">Receives proxy bits</text>
  <rect class="data" x="895" y="815" width="220" height="75" rx="6"/>
  <text class="label" x="913" y="840">Prototype interface</text>
  <text class="detail" x="913" y="865">Answer, evidence, risk</text>
  <path class="flow" d="M290 852 H345"/>
  <path class="flow" d="M565 852 H620"/>
  <path class="flow" d="M840 852 H895"/>
  <text class="note" x="70" y="913">The 45-record hybrid test metrics describe offline detector inputs, not these live proxy inputs.</text>
</svg>
